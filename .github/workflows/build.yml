name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o nova-gfn-app.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p proj assembleDebug --no-daemon
      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk NOVA-GFN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-GFN
          path: NOVA-GFN.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NOVA-GFN.apk -t "NOVA GFN" -n "APK debug"
